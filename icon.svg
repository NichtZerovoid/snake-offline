
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172947"/>
      <stop offset="100%" stop-color="#080b18"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#35f2e5" stroke-width="7" opacity=".6"/>
  <g fill="#35f2e5" filter="url(#glow)">
    <rect x="125" y="125" width="90" height="90" rx="24"/>
    <rect x="220" y="125" width="90" height="90" rx="24"/>
    <rect x="220" y="220" width="90" height="90" rx="24"/>
    <rect x="315" y="220" width="90" height="90" rx="24"/>
    <rect x="315" y="315" width="90" height="90" rx="24"/>
  </g>
  <circle cx="390" cy="115" r="30" fill="#ff4fd8" filter="url(#glow)"/>
</svg>
